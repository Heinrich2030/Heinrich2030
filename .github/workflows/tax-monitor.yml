name: Steuerwerte-Überwachung

# Läuft monatlich und meldet per Issue, wenn Steuerwerte fehlen oder
# noch vorläufig sind. Die KI-Aktualisierung selbst übernimmt die geplante
# Claude-Aufgabe (siehe docs/KI-UEBERWACHUNG.md).
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: |
          set +e
          node scripts/check-years.js > report.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.txt
      - if: steps.check.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("report.txt", "utf8");
            const title = "Steuerwerte aktualisieren";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title,
                body: body + "\n\nSiehe docs/KI-UEBERWACHUNG.md.",
              });
            }
