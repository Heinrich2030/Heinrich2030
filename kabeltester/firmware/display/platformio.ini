; Display-Einheit: Waveshare ESP32-S3-Touch-LCD-7 (800×480, kapazitiver Touch)
; Display-Initialisierung über die Waveshare-/Espressif-Bibliothek ESP32_Display_Panel.
; lvgl_port_v8.cpp/.h aus dem Waveshare-Beispiel "lvgl_v8_port" nach src/ kopieren (siehe README).
[env:waveshare_7]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
    -I../common
    -Isrc
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DESP_PANEL_BOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_7=1
lib_deps =
    lvgl/lvgl@8.4.0
    espressif/ESP32_Display_Panel@0.1.8
    espressif/ESP32_IO_Expander@0.0.4
monitor_speed = 115200
